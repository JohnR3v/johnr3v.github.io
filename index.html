<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bad Guys da Cyber - Portfólio & Desafios</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <!-- Canvas do Jogo -->
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        
        <!-- HUD / Informações na Tela -->
        <div id="hud">
            <span id="location-text">Local: Campo Externo</span>
            <span id="objective-text">Objetivo: Entre na casa "Desafios"</span>
        </div>

        <!-- Modal de Desafios Hacker -->
        <div id="challenge-modal" class="modal hidden">
            <div class="modal-content">
                <h2 id="modal-title">Terminal de Hacking</h2>
                <p id="modal-question">Carregando pergunta...</p>
                <div id="modal-options"></div>
                <button id="modal-close" onclick="closeChallenge()">Fechar [ESC]</button>
            </div>
        </div>

        <!-- Controles Mobile (D-Pad & Botão de Ação) -->
        <div id="mobile-controls">
            <div class="dpad">
                <button id="btn-up" class="dpad-btn">▲</button>
                <div class="dpad-middle">
                    <button id="btn-left" class="dpad-btn">◀</button>
                    <button id="btn-right" class="dpad-btn">▶</button>
                </div>
                <button id="btn-down" class="dpad-btn">▼</button>
            </div>
            <div class="action-buttons">
                <button id="btn-action" class="action-btn">A</button>
            </div>
        </div>
    </div>

    <!-- Scripts separados -->
    <script src="touch.js"></script>
    <script src="player.js"></script>
    <script src="script.js"></script>
</body>
</html>
